<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حلويات على طريقتك</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff5f5;
      color: #333;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #d63852;
      margin-top: 10px;
      font-size: 2rem;
    }
    .intro {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    .products-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border: 1px solid #ffccd5;
      border-radius: 16px;
      padding: 20px;
      width: 140px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .card-emoji {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 5px 0;
      color: #222;
      font-size: 1.1rem;
    }
    .price {
      color: #d63852;
      font-weight: bold;
      margin: 8px 0;
    }
    .btn-order {
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      display: inline-block;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>🍰 حلويات على طريقتك</h1>
  <p class="intro">أهلاً بكم في متجر الحلويات الخاص بنا</p>

  <h2>منتجاتنا المميزة</h2>

  <div class="products-grid">
    <div class="card">
      <div class="card-emoji">🎂</div>
      <h3>كعكات</h3>
      <div class="price">250 ج.م</div>
      <a href="https://wa.me/201000000000?text=أريد%20طلب%20كعك" class="btn-order" target="_blank">طلب واتساب 💬</a>
    </div>

    <div class="card">
      <div class="card-emoji">🧁</div>
      <h3>كب كيك</h3>
      <div class="price">35 ج.م</div>
      <a href="https://wa.me/201000000000?text=أريد%20طلب%20كب%20كيك" class="btn-order" target="_blank">طلب واتساب 💬</a>
    </div>

    <div class="card">
      <div class="card-emoji">🍪</div>
      <h3>كوكيز</h3>
      <div class="price">25 ج.م</div>
      <a href="https://wa.me/201000000000?text=أريد%20طلب%20كوكيز" class="btn-order" target="_blank">طلب واتساب 💬</a>
    </div>

    <div class="card">
      <div class="card-emoji">🍫</div>
      <h3>شوكولاتة</h3>
      <div class="price">50 ج.م</div>
      <a href="https://wa.me/201000000000?text=أريد%20طلب%20شوكولاتة" class="btn-order" target="_blank">طلب واتساب 💬</a>
    </div>
  </div>

</body>
</html>
