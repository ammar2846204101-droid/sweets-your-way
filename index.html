<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حلويات على كيفك</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fce4ec url('file_00000000c26481f48ca54b81a') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      margin: 0;
      padding: 20px 15px;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.22);
      z-index: 0;
      pointer-events: none;
    }

    /* 🔥 تصميم الشاشة الافتتاحية السينمائية 🔥 */
    #splash-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #3b1408;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 1s ease, visibility 1s;
    }

    /* إطارات وتفاصيل الزوايا الأربعة */
    .corner {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 4px solid transparent;
      opacity: 0;
    }

    /* 1. الزاوية أعلى اليسار */
    .corner-top-left {
      top: 20px; left: 20px;
      border-top-color: #ffd700;
      border-left-color: #ffd700;
      border-top-left-radius: 20px;
      animation: drawCorner 0.6s forwards 0.2s;
    }

    /* 2. الزاوية أعلى اليمين */
    .corner-top-right {
      top: 20px; right: 20px;
      border-top-color: #ffd700;
      border-right-color: #ffd700;
      border-top-right-radius: 20px;
      animation: drawCorner 0.6s forwards 0.8s;
    }

    /* 3. الزاوية أسفل اليسار */
    .corner-bottom-left {
      bottom: 20px; left: 20px;
      border-bottom-color: #ffd700;
      border-left-color: #ffd700;
      border-bottom-left-radius: 20px;
      animation: drawCorner 0.6s forwards 1.4s;
    }

    /* 4. الزاوية أسفل اليمين */
    .corner-bottom-right {
      bottom: 20px; right: 20px;
      border-bottom-color: #ffd700;
      border-right-color: #ffd700;
      border-bottom-right-radius: 20px;
      animation: drawCorner 0.6s forwards 2.0s;
    }

    @keyframes drawCorner {
      0% { opacity: 0; transform: scale(0.4); }
      100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px #ffd700); }
    }

    /* منطقة الرسائل والنصوص في النص */
    .splash-content {
      position: relative;
      width: 100%;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* الخط النصفي والعبارات المارة */
    .text-slide {
      position: absolute;
      white-space: nowrap;
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff 0%, #ffd700 50%, #fff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateX(100vw);
    }

    /* الجملة الأولى */
    .msg-1 {
      animation: slidePass 2.2s ease-in-out 2.7s forwards;
    }

    /* الجملة الثانية */
    .msg-2 {
      animation: slidePass 2.4s ease-in-out 5.0s forwards;
    }

    @keyframes slidePass {
      0% { opacity: 0; transform: translateX(100vw); }
      30% { opacity: 1; transform: translateX(0); }
      70% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-100vw); }
    }

    /* اسم المتجر النهائي الذي يلمع */
    .final-brand {
      position: absolute;
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffffff;
      padding: 10px 25px;
      border-top: 2px dashed rgba(255, 215, 0, 0.7);
      border-bottom: 2px dashed rgba(255, 215, 0, 0.7);
      background: linear-gradient(90deg, #fff 0%, #ffd700 50%, #fff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: scale(0.7);
      animation: revealBrand 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 7.6s forwards, shine 1.8s infinite 8.4s;
    }

    @keyframes revealBrand {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 15px #ffd700); }
    }

    @keyframes shine {
      0% { background-position: -200%; }
      100% { background-position: 200%; }
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
    }
    
    /* 80 إيموجي صغيرة متساقطة */
    .sweets-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .sweet {
      position: absolute; top: -40px;
      user-select: none; animation: fall linear infinite;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.15; }
    }

    /* المحتوى الرئيسي للموقع */
    .content { position: relative; z-index: 2; }
    .header { margin-top: 20px; margin-bottom: 25px; }
    h1 { color: #ffffff; font-size: 2.4rem; margin: 0 0 5px 0; font-weight: 900; text-shadow: 0 4px 10px rgba(0,0,0,0.7); }
    .intro { color: #ffe3e8; font-size: 1.1rem; margin: 0; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }
    
    .section-title {
      color: #fff; font-size: 1.05rem; margin: 25px 0 20px 0; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .section-title::before, .section-title::after { content: ""; height: 2px; width: 40px; background-color: #ffd700; }
    
    .categories-grid {
      display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 500px; margin: 0 auto;
    }

    .category-card {
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 20px 15px;
      width: 45%;
      min-width: 140px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25), 0 5px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateY(-5px);
    }

    .category-card:active {
      transform: translateY(2px) scale(0.97);
    }

    .offers-card {
      border: 2px solid #ff3355 !important;
      background: rgba(255, 245, 247, 0.5) !important;
    }

    .emoji { font-size: 3.2rem; margin-bottom: 8px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
    .category-card h3 { margin: 6px 0; color: #111111; font-size: 1.25rem; font-weight: 800; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

    .btn-view {
      background: linear-gradient(135deg, #4a1c0d 0%, #8b001a 100%);
      color: white; padding: 8px 16px; border-radius: 20px;
      font-size: 0.85rem; font-weight: bold; margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .whatsapp-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #25D366; color: white; text-decoration: none;
      font-size: 1.1rem; font-weight: bold; padding: 14px 25px;
      border-radius: 30px; max-width: 300px; margin: 35px auto 20px auto;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="corner corner-top-left"></div>
    <div class="corner corner-top-right"></div>
    <div class="corner corner-bottom-left"></div>
    <div class="corner corner-bottom-right"></div>

    <div class="splash-content">
      <div class="text-slide msg-1">✧ طعم لا يقاوم ✧</div>
      <div class="text-slide msg-2">✧ حلاوة تاخدك لعالم تاني ✧</div>
      <div class="final-brand">حلويات على كيفك</div>
    </div>
  </div>

  <div class="sweets-container" id="sweets"></div>

  <div class="content">
    <div class="header">
      <h1>🍰 حلويات على كيفك</h1>
      <p class="intro">أهلاً بكم في متجرنا!</p>
    </div>

    <div class="section-title">اختر القسم</div>
    
    <div class="categories-grid">
      <a href="offers.html" class="category-card offers-card">
        <div class="emoji">🎁</div>
        <h3>العروض والتوفير</h3>
        <span class="btn-view" style="background: #111;">شاهد العروض 🔥</span>
      </a>
      
      <a href="cakes.html" class="category-card">
        <div class="emoji">🎂</div>
        <h3>كعكات</h3>
        <span class="btn-view">تصفح 👈</span>
      </a>
      <a href="cupcakes.html" class="category-card">
        <div class="emoji">🧁</div>
        <h3>كب كيك</h3>
        <span class="btn-view">تصفح 👈</span>
      </a>
      <a href="cookies.html" class="category-card">
        <div class="emoji">🍪</div>
        <h3>كوكيز</h3>
        <span class="btn-view">تصفح 👈</span>
      </a>
    </div>

    <a href="https://wa.me/201223138796" target="_blank" class="whatsapp-btn">
      <span>💬 تواصل معنا عبر واتساب</span>
    </a>
  </div>

  <script>
    /* توقيت إخفاء الشاشة الافتتاحية بعد اكتمال جميع العروض */
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash-screen').classList.add('fade-out');
      }, 11000); /* تفتح الصفحة الرئيسية بعد 11 ثانية من العرض الممتع */
    });

    /* إيموجيهات صغيرة متساقطة في الخلفية */
    const sweetsList = ['🍰', '🧁', '🍪', '🍩', '🍫', '🍓', '🍬', '✨', '🎂', '🍭', '🍒'];
    const container = document.getElementById('sweets');
    
    for (let i = 0; i < 80; i++) {
      const sweet = document.createElement('div');
      sweet.classList.add('sweet');
      sweet.innerText = sweetsList[Math.floor(Math.random() * sweetsList.length)];
      sweet.style.left = Math.random() * 98 + 'vw';
      sweet.style.animationDuration = (Math.random() * 6 + 3) + 's';
      sweet.style.animationDelay = (Math.random() * 7) + 's';
      sweet.style.fontSize = (Math.random() * 0.4 + 0.9) + 'rem';
      container.appendChild(sweet);
    }
  </script>

</body>
</html>
